plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.adapterz'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	//H2 DB 연결 - 미니 퀘스트 -> 1단계: 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//implementation 'org.springframework.boot:spring-boot-starter-jdbc' // 선택: 코드로 쿼리 테스트 시 권장
	// JPA Repository와 Entity 매핑은 기존처럼 Hibernate가 담당합니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 중요: H2 -> MySQL 데이터 이전을 검증하기 전까지 기존 H2 실행 경로를 유지합니다.
	runtimeOnly 'com.h2database:h2'
	// Spring Boot가 Docker MySQL에 JDBC로 연결할 때 사용하는 공식 드라이버입니다.
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway가 버전별 SQL 마이그레이션을 실행하고 적용 이력을 관리합니다.
	implementation 'org.flywaydb:flyway-core'
	// 중요: Flyway가 MySQL DB를 인식하고 마이그레이션하기 위한 전용 모듈입니다.
	implementation 'org.flywaydb:flyway-mysql'

	// 테스트코에 필요한 라이브러리
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//Lombok 추가
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//본 포함되지 않으므로 별도의 validation 의존성을 추가
	implementation 'org.springframework.boot:spring-boot-starter-validation'


	//시큐리티 의존성
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT 생성 및 검증
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

// 중요: Gradle이 JUnit 5(Jupiter)의 @Test 메서드를 찾아 실행하도록 설정합니다.
tasks.named('test') {
	useJUnitPlatform()
}
