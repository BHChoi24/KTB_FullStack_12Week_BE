name: Backend CI

# 중요: main 대상 PR과 main 반영 시 동일한 검증을 수행합니다.
# workflow_dispatch는 GitHub Actions 화면에서 필요할 때 수동 실행하는 기능입니다.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub 저장소에는 테스트에 필요한 읽기 권한만 줍니다.
# ECR/SSM 권한은 아래 deploy Job에서 AWS Access Key로 별도 인증합니다.
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전의 오래된 CI 실행을 취소합니다.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h2-tests:
    name: H2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      # 기존 @ActiveProfiles("h2") 테스트와 Service/Controller 단위 테스트를 모두 실행합니다.
      - name: Run tests
        run: ./gradlew test --no-daemon

  mysql-startup:
    name: MySQL, Flyway and Spring Boot startup
    needs: h2-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Runner 전용 임시 MySQL입니다. 운영 EC2 DB와 연결되지 않습니다.
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: never_enough
          MYSQL_USER: never_enough_app
          MYSQL_PASSWORD: ci_mysql_password
          MYSQL_ROOT_PASSWORD: ci_root_password
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      # 애플리케이션이 MySQL에 연결되고 Flyway V1/V2와 Hibernate validate를 통과해야
      # /actuator/health가 {"status":"UP"}을 반환합니다.
      - name: Verify MySQL startup and health
        env:
          SPRING_PROFILES_ACTIVE: mysql
          MYSQL_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/never_enough?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
          MYSQL_DATASOURCE_USERNAME: never_enough_app
          MYSQL_DATASOURCE_PASSWORD: ci_mysql_password
          JWT_SECRET: ci-only-jwt-secret-key-at-least-32-bytes
          PASSWORD_MIGRATION_ENABLED: "false"
          APP_UPLOAD_DIRECTORY: ${{ runner.temp }}/uploads
          APP_RECOVERY_DIRECTORY: ${{ runner.temp }}/recovery
          SPRING_JPA_SHOW_SQL: "false"
        run: |
          LOG_FILE="$RUNNER_TEMP/backend-mysql.log"
          HEALTH_FILE="$RUNNER_TEMP/backend-health.json"

          ./gradlew bootRun --no-daemon >"$LOG_FILE" 2>&1 &
          BACKEND_PID=$!

          cleanup() {
            kill "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8080/actuator/health \
              >"$HEALTH_FILE"; then
              cat "$HEALTH_FILE"
              grep -q '"status":"UP"' "$HEALTH_FILE"
              exit 0
            fi

            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          echo "Spring Boot did not become healthy."
          cat "$LOG_FILE"
          exit 1

  deploy:
    name: Build, push and deploy backend
    # PR에서는 절대 배포하지 않습니다. main 병합(push) 또는 main에서 수동 실행할 때만 배포합니다.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: mysql-startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    # immutable ECR 태그는 현재 main 커밋 SHA를 사용합니다.
    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
      EC2_DEPLOY_DIRECTORY: ${{ vars.EC2_DEPLOY_DIRECTORY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # GitHub Environment production의 전용 IAM Access Key로만 AWS API를 호출합니다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # EC2는 linux/amd64이므로 Mac 개발 환경과 무관하게 AMD64 이미지를 ECR에 생성합니다.
      - name: Build and push immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # SSM은 SSH 개인키와 22번 포트 없이 EC2에 명령을 전달합니다.
      # EC2 .env의 BACKEND_IMAGE_TAG만 바꿔 backend 컨테이너만 교체합니다.
      - name: Deploy backend through SSM Run Command
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS_JSON="$(jq -cn \
            --arg deploy_dir "$EC2_DEPLOY_DIRECTORY" \
            --arg image_tag "$IMAGE_TAG" \
            --arg aws_region "$AWS_REGION" \
            --arg aws_account_id "$AWS_ACCOUNT_ID" \
            '[
              "set -euo pipefail",
              "cd \($deploy_dir)",
              "test -f .env",
              "test -f compose.ec2.yaml",
              "PREVIOUS_TAG=$(sed -n '\''s/^BACKEND_IMAGE_TAG=//p'\'' .env)",
              "test -n \"$PREVIOUS_TAG\"",
              "sed -i \"s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=\($image_tag)/\" .env",
              "aws ecr get-login-password --region \($aws_region) | docker login --username AWS --password-stdin \($aws_account_id).dkr.ecr.\($aws_region).amazonaws.com",
              "if ! docker compose --env-file .env -f compose.ec2.yaml pull backend || ! docker compose --env-file .env -f compose.ec2.yaml up -d --no-deps --wait --wait-timeout 180 backend; then sed -i \"s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=$PREVIOUS_TAG/\" .env; docker compose --env-file .env -f compose.ec2.yaml up -d --no-deps --wait --wait-timeout 180 backend || true; exit 1; fi",
              "docker compose --env-file .env -f compose.ec2.yaml ps backend"
            ]')"

          PARAMETERS_JSON="$(jq -cn --argjson commands "$COMMANDS_JSON" '{commands: $commands}')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy backend image $IMAGE_TAG" \
            --parameters "$PARAMETERS_JSON" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                echo "Backend deployment completed."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Backend deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.command_id }}" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out while waiting for the SSM deployment command."
          exit 1
