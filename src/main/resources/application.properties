# 중요: DB 연결과 스키마 관리 설정은 application-h2.properties 또는
# application-mysql.properties에서 명시적으로 선택합니다. 기본 DB 프로필은 없습니다.

# JPA가 실행하는 SQL을 콘솔에 출력
spring.jpa.show-sql=true
# SQL을 보기 좋게 줄바꿈
spring.jpa.properties.hibernate.format_sql=true

#JSON은 스네이크 케이스를 권장하기 때문에 JAVA의 카멜 케이스와 맞춰주기 위해 사용
spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT 서명 키는 운영 환경에서 반드시 JWT_SECRET 환경 변수로 주입합니다.
# 아래 기본값은 로컬 학습용이며, 32바이트 이상이어야 합니다.
jwt.secret=${JWT_SECRET:artifact-local-jwt-secret-key-2026-change-me}
jwt.expiration-millis=3600000

# 프로필 또는 게시글 이미지 한 개와 JSON 파트를 포함한 멀티파트 요청의 크기를 제한합니다.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 실행 중 업로드한 사용자 파일은 빌드 산출물이 아닌 외부 폴더에 저장합니다.
app.upload.directory=uploads



# 탈퇴 프로필 이미지는 HTTP로 공개되지 않는 별도 폴더에서 30일 동안 보관합니다.
app.recovery.directory=recovery
app.account-recovery.retention-days=30
# 매시간 정각, 한국 시간 기준으로 만료 계정을 최대 100개씩 익명화합니다.
app.account-recovery.cleanup-cron=0 0 * * * *
app.account-recovery.cleanup-zone=Asia/Seoul
# DB 커밋 전 파일을 오인 삭제하지 않도록 생성 후 2시간이 지난 미참조 파일만 매시 30분 정리합니다.
app.account-recovery.orphan-grace-hours=2
app.account-recovery.orphan-cleanup-cron=0 30 * * * *



# 기존 평문 비밀번호 -> 일괄 변환, 명시적으로 true로 키면 수행
# 변환 완료 후에는 다시 false로 실행해야 불필요한 전체 회원 조회를 피할 수 있음
app.password-migration.enabled=${PASSWORD_MIGRATION_ENABLED:false}
