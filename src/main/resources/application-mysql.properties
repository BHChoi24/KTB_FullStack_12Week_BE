# IntelliJ에서 실행할 때 Docker MySQL의 로컬 공개 포트에 연결합니다.
spring.datasource.url=${MYSQL_DATASOURCE_URL:jdbc:mysql://localhost:3306/never_enough?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_DATASOURCE_USERNAME:never_enough_app}

# 중요: 실제 비밀번호는 파일에 기본값으로 기록하지 않고 IntelliJ 환경변수로 주입합니다.
spring.datasource.password=${MYSQL_DATASOURCE_PASSWORD}

# Flyway가 먼저 스키마를 적용하고 Hibernate는 Entity와 실제 테이블의 일치 여부만 확인합니다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

# MySQL 프로필에서는 H2 Console을 제공하지 않습니다.
spring.h2.console.enabled=false
