# MySQL 이전 전의 파일 H2를 비교·백업 확인할 때만 명시적으로 사용하는 프로필입니다.
# 실행 예: SPRING_PROFILES_ACTIVE=h2-legacy

# 중요: ACCESS_MODE_DATA=r과 Hikari read-only를 함께 적용해 원본 수정을 막습니다.
spring.datasource.url=jdbc:h2:file:~/h2db/testdb;ACCESS_MODE_DATA=r
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.read-only=true

# 기존 파일을 수정하지 않고 Entity와 읽을 수 있는 구조인지만 검증합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# 필요할 때 브라우저에서 기존 데이터를 조회할 수 있습니다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 읽기 전용 확인 중에는 데이터 변경 성격의 시작 작업도 비활성화합니다.
app.password-migration.enabled=false
