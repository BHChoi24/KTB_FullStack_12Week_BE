# H2는 MySQL 전환 중 원본 확인과 기존 기능 비교를 위해 명시적으로만 사용합니다.
spring.datasource.url=jdbc:h2:file:~/h2db/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 로컬 H2 프로필에서만 H2 Console을 활성화합니다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 기존 H2 파일은 현재 Entity 구조에 맞춰 관리하던 동작을 전환 완료 전까지 유지합니다.
spring.jpa.hibernate.ddl-auto=update

# 중요: 앞으로 작성할 Flyway SQL은 MySQL 전용이므로 H2에서는 실행하지 않습니다.
spring.flyway.enabled=false
